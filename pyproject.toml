[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cleanspace"
version = "0.1.0"
description = "Local bilingual Windows disk analysis and safe cleanup assistant"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "허준영"}]
dependencies = [
  "PySide6>=6.9,<7",
  "Pillow>=11,<13",
  "Send2Trash>=1.8,<2",
]

[project.scripts]
cleanspace = "cleanspace.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cleanspace = ["locales/*.json", "assets/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest-tmp"
